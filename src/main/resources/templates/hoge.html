<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">



<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>PDF Report</title>
<style>
body {
  font-family: 'Noto Sans JP';
}
@page {
  
  size: A3 landscape;   /* A3の横向き */
  font-size: 10.5pt;     /* 目安: 9–11pt */
  line-height: 1.4;      /* 行間は明示すると崩れにくい */
  margin: 10mm;         /* 余白はお好みで */
  margin-right: 1mm;
  margin-left: 1mm;
  margin-top: 10mm;
  margin-bottom: 10mm;

  @top-center {
    content: "seiko";
  }
  @bottom-center {
    content: "Page " counter(page) " of " counter(pages);
    font-size: 10px;
  }
}

table {
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
  -fs-table-paginate: paginate;  /* ← FS独自。表の改ページを明示 超重要 */
}
thead{ display: table-header-group; page-break-after: avoid; }
tbody{ display: table-row-group; }
tr   { page-break-inside: avoid; break-inside: avoid; }
th,td{ border:1px solid #333; padding:8px; }

.mb4 {
  margin-bottom: 4px;
}

/* 横並びコンテナ */
.header-container {
    width: 100%;
    overflow: hidden; /* clearfix */
}

/* 左側：float left */
.left-section {
    float: left;
    width: 45%;
}

/* 右側：float right */
.right-section {
    float: right;
    width: 50%;
}

/* メインテーブル：floatの影響をクリア */
.main-table {
    clear: both;
}
</style>
</head>
<body>
  <div style="width: 100%;" class="mb4 header-container">

    <div class="left-section">
      <div>南花畑発電所</div>
      <div>巡視日常点検 2025年7月</div>
    </div>

    <table class="right-section">
      <thead class="table-header">
        <tr>
          <th class="col-name">名前</th>
          <th class="col-date">日付</th>
          <th class="col-action">操作</th>
        </tr>
      </thead>
      <tbody class="table-body">
        <tr class="table-row">
          <td class="col-name">深川</td>
          <td class="col-date">2025年7月10日</td>
          <td class="col-action">承認</td>
        </tr>
        <tr class="table-row">
          <td class="col-name">田中</td>
          <td class="col-date">2025年7月7日</td>
          <td class="col-action">報告</td>
        </tr>
      </tbody>
    </table>
    <div style="clear: both;"></div>
  </div>

<table>
  <thead>
    <tr>
    <th th:each="h : ${headers}" th:text="${h}">Header</th>

    </tr>
  </thead>
  <tbody>
    <tr th:each="row : ${rows}">
      <td th:text="${row.name}">name</td>
      <td th:text="${row.value}">value</td>
    </tr>
  </tbody>
</table>

</body>
</html>
